[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failure-atlas"
version = "0.1.0"
description = "An agent for discovering machine-learning model failure boundaries"
requires-python = ">=3.12"
license = {text = "MIT"}

[project.scripts]
failure-atlas = "failure_atlas.agent:main"

[tool.setuptools.packages.find]
include = ["failure_atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
